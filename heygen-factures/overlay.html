<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Energy Market — habillage « Réduisez vos factures »</title>
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('../assets/PlusJakartaSans.woff2') format('woff2');
    font-weight: 200 800;
  }
  :root {
    --cream: #f7f2e9;
    --navy: #1b2c66;
    --navy-deep: #13204d;
    --gold: #c9a24f;
    --gold-2: #e3c67f;
    --gold-light: #f4e7c4;
    --ink: #142152;
    --green: #2f9e5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Fond transparent : la vidéo HeyGen est incrustée dessous par compose.sh */
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.preview { background: #888 url('preview.jpg') 30px 316px / 1020px 1568px no-repeat; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

  /* Fenêtre vidéo : 1020×1568 en (30, 316) — doit suivre compose.sh */
  #win { position: absolute; left: 30px; top: 316px; width: 1020px; height: 1568px; border-radius: 14px;
    box-shadow: 0 0 0 1600px var(--cream); }
  #shade { position: absolute; left: 30px; top: 316px; width: 1020px; height: 1568px; border-radius: 14px;
    background: linear-gradient(180deg, rgba(19,32,77,.28) 0%, rgba(19,32,77,0) 14%, rgba(19,32,77,0) 80%, rgba(19,32,77,.45) 100%); }
  #frame { position: absolute; left: 14px; top: 300px; width: 1052px; height: 1600px; border-radius: 26px;
    border: 16px solid var(--navy); box-shadow: 0 30px 70px rgba(20,33,82,.25); }
  #frame::after { content: ''; position: absolute; inset: -7px; border: 3px solid var(--gold); border-radius: 20px; }
  .corner { position: absolute; width: 70px; height: 70px; border: 7px solid var(--gold-2); }
  .corner.tl { left: 16px; top: 302px; border-right: 0; border-bottom: 0; border-top-left-radius: 24px; }
  .corner.tr { right: 16px; top: 302px; border-left: 0; border-bottom: 0; border-top-right-radius: 24px; }
  .corner.bl { left: 16px; top: 1828px; border-right: 0; border-top: 0; border-bottom-left-radius: 24px; }
  .corner.br { right: 16px; top: 1828px; border-left: 0; border-top: 0; border-bottom-right-radius: 24px; }

  /* En-tête */
  #head { position: absolute; left: 0; top: 22px; width: 1080px; text-align: center; }
  #logo { width: 440px; display: block; margin: 0 auto; }
  #tagline { margin-top: -2px; font-size: 27px; font-weight: 600; letter-spacing: .32em; color: var(--navy); padding-left: .32em; }
  #rule { width: 560px; height: 3px; margin: 4px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

  /* Étiquette d'étape (haut de la vidéo) */
  #tagwrap { position: absolute; left: 30px; top: 346px; width: 1020px; height: 120px; }
  .tag { position: absolute; left: 50%; top: 0; display: inline-flex; align-items: center; gap: 18px; padding: 14px 34px 14px 16px;
    border-radius: 999px; background: var(--navy); color: #fff; font-size: 38px; font-weight: 800; letter-spacing: -.005em;
    border: 3px solid var(--gold); box-shadow: 0 16px 40px rgba(13,20,50,.4); white-space: nowrap; opacity: 0; }
  .tag .n { flex: 0 0 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #f1d58c, #c9a24f 60%, #b48a39);
    color: var(--navy-deep); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; }
  .tag .n svg { width: 36px; height: 36px; }
  .tag b { color: var(--gold-2); font-weight: 800; }

  /* Sous-titres */
  #caps { position: absolute; left: 30px; top: 1520px; width: 1020px; height: 200px; }
  .cap { position: absolute; left: 50%; bottom: 0; width: 960px; text-align: center; opacity: 0; transform-origin: 50% 100%;
    font-size: 64px; font-weight: 800; line-height: 1.12; letter-spacing: -.015em; color: #fff;
    -webkit-text-stroke: 3px var(--navy-deep); paint-order: stroke fill;
    text-shadow: 0 4px 0 var(--navy-deep), 0 8px 24px rgba(10,16,40,.55); }
  .cw { display: inline-block; margin: 0 .07em; transform-origin: 50% 80%; }
  .cw.key { color: var(--gold-2); }
  .cw.cur { color: #f1d58c; }
  .cw.key.cur { color: #fff3cf; }

  /* Barre du bas */
  #bar { position: absolute; left: 62px; top: 1740px; width: 956px; height: 130px; border-radius: 30px; background: var(--navy);
    display: flex; align-items: center; padding: 0 12px 0 20px; gap: 18px; box-shadow: 0 20px 50px rgba(13,20,50,.4);
    border: 3px solid rgba(201,162,79,.6); }
  #avatar { flex: 0 0 84px; height: 84px; border-radius: 50%; border: 4px solid var(--gold); display: flex; align-items: center; justify-content: center; background: #24387a; }
  #who { color: #fff; font-size: 30px; font-weight: 800; line-height: 1.25; white-space: nowrap; }
  #who small { display: block; font-size: 23px; font-weight: 600; color: rgba(255,255,255,.75); }
  #pill { margin-left: auto; flex: 0 0 440px; position: relative; height: 100px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(135deg, #f1d58c 0%, #c9a24f 55%, #b48a39 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.5); }
  #shine { position: absolute; inset: 0; }
  .pt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 16px;
    font-size: 32px; font-weight: 800; color: var(--navy-deep); white-space: nowrap; letter-spacing: -.01em; }
  .pt svg { flex: 0 0 auto; width: 42px; height: 42px; }
  .pt span { flex-shrink: 0; }

  /* Pièces */
  .coin { position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff1c2, #e3c67f 50%, #b48a39); border: 3px solid #b48a39;
    display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; color: #7a5a22; opacity: 0; }

  /* Écran de fin */
  #wipe { position: absolute; left: -200px; width: 1480px; height: 2400px; top: 0; background: var(--gold); transform: translateY(2000px) skewY(-8deg); }
  #end { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 30%, #fffdf8 0%, var(--cream) 55%, #efe6d6 100%);
    transform: translateY(2000px); text-align: center; }
  #end .in { position: absolute; left: 0; width: 1080px; }
  #e-logo { width: 560px; display: block; margin: 0 auto; }
  .e-h { font-size: 84px; font-weight: 800; line-height: 1.05; letter-spacing: -.03em; color: var(--navy); }
  .e-g { color: #a9822f; }
  .steps { display: flex; justify-content: center; gap: 26px; }
  .st { width: 290px; padding: 30px 18px 26px; border-radius: 28px; background: #fff; box-shadow: 0 18px 40px rgba(20,33,82,.16);
    border: 2px solid rgba(201,162,79,.5); }
  .st .ic { width: 96px; height: 96px; margin: 0 auto 16px; border-radius: 50%; background: var(--navy); display: flex; align-items: center; justify-content: center; }
  .st .ic svg { width: 54px; height: 54px; }
  .st b { display: block; font-size: 32px; font-weight: 800; color: var(--navy); line-height: 1.15; }
  .st span { display: block; margin-top: 8px; font-size: 24px; font-weight: 600; color: #6b7393; line-height: 1.25; }
  .cta { display: inline-flex; align-items: center; gap: 20px; background: var(--navy); color: #fff; border-radius: 30px;
    padding: 34px 60px; font-size: 60px; font-weight: 800; letter-spacing: -.01em; box-shadow: 0 26px 60px rgba(20,33,82,.35); border: 4px solid var(--gold); }
  .note { display: inline-block; padding: 14px 30px; border-radius: 999px; background: rgba(201,162,79,.16); border: 2px solid rgba(201,162,79,.7);
    font-size: 30px; font-weight: 700; color: #7a5a22; }
</style>
</head>
<body>
<div id="stage">
  <div id="win"></div>
  <div id="shade"></div>
  <div id="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

  <div id="head">
    <img id="logo" src="../assets/logo.png" alt="Energy Market">
    <div id="rule"></div>
  </div>

  <div id="tagwrap"></div>
  <div id="caps"></div>

  <div id="bar">
    <div id="avatar"><svg viewBox="0 0 96 96" width="80" height="80">
      <circle cx="48" cy="38" r="17" fill="none" stroke="#e3c67f" stroke-width="5"/>
      <path d="M18 84 C20 64 32 58 48 58 C64 58 76 64 78 84" fill="none" stroke="#e3c67f" stroke-width="5" stroke-linecap="round"/></svg></div>
    <div id="who">Energy Market<small>Courtier en énergie · TPE &amp; PME</small></div>
    <div id="pill"><div id="shine"></div></div>
  </div>
  <div id="coins"></div>

  <div id="wipe"></div>
  <div id="end">
    <div class="in" id="e1" style="top:150px"><img id="e-logo" src="../assets/logo.png" alt=""></div>
    <div class="in e-h" id="e2" style="top:520px">Réduisez vos factures</div>
    <div class="in e-h e-g" id="e3" style="top:620px">Diagnostic gratuit en 24&nbsp;h</div>
    <div class="in" id="e4" style="top:880px"><div class="steps">
      <div class="st"><div class="ic"><svg viewBox="0 0 54 54"><path d="M14 5 h18 l10 10 v34 h-28 z" fill="none" stroke="#e3c67f" stroke-width="4.5" stroke-linejoin="round"/><path d="M20 26 h16 M20 34 h16 M20 42 h10" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg></div>
        <b>1. Votre facture</b><span>Envoyez la dernière reçue</span></div>
      <div class="st"><div class="ic"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="20" fill="none" stroke="#e3c67f" stroke-width="5"/><path d="M18 28 l6 6 12 -14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <b>2. On analyse</b><span>Gratuitement, sous 24&nbsp;h</span></div>
      <div class="st"><div class="ic"><svg viewBox="0 0 54 54"><rect x="5" y="13" width="44" height="28" rx="6" fill="none" stroke="#e3c67f" stroke-width="5"/><text x="27" y="35" text-anchor="middle" font-size="21" font-weight="800" fill="#fff" font-family="Plus Jakarta Sans">€</text></svg></div>
        <b>3. Vous payez moins</b><span>Sans honoraires ni changement de compteur</span></div>
    </div></div>
    <div class="in" id="e5" style="top:1300px"><span class="cta">energy-market.fr <span style="color:var(--gold-2)">→</span></span></div>
    <div class="in" id="e6" style="top:1510px"><span class="note">ou envoyez votre facture en message privé</span></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  outQuint: x => 1 - Math.pow(1 - x, 5),
  in: x => x * x * x,
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};

/* Calage sur la voix de la vidéo HeyGen (transcription mot à mot faster-whisper) */
const VIDEO_END = 23.94;           // fin de la vidéo source
const DURATION = 27.1;             // + écran de fin
const PHASES = [
  // [début, fin, icône/numéro, texte de l'étiquette, icône pastille, texte pastille]
  [0.2, 3.54, 'q', 'Plus de <b>800&nbsp;€/mois</b> d\'énergie&nbsp;?', 'bolt', 'Gaz · Électricité'],
  [3.54, 8.6, 'user', 'On accompagne <b>TPE &amp; PME</b>', 'shop', 'TPE · PME'],
  [8.6, 13.75, 'search', '<b>Analyse gratuite</b> de vos factures', 'free', 'Analyse gratuite'],
  [13.75, 17.5, 'ok', '<b>0&nbsp;€</b> d\'honoraires · aucun changement', 'free', '0 € d\'honoraires'],
  [17.5, 19.35, 'euro', '<b>Vous payez moins</b>', 'euro', 'Vous payez moins'],
  [19.35, 21.6, 'doc', 'Envoyez <b>votre dernière facture</b>', 'doc', 'Envoyez votre facture'],
  [21.6, VIDEO_END, 'clock', '<b>Diagnostic gratuit</b> en 24&nbsp;h', 'clock', 'Diagnostic sous 24 h'],
];
const COMMISSION_AT = 18.8;        // pluie de pièces sur « moins »

/* Sous-titres : [fin du groupe, [mot, instant], …] — « * » = mot clé en doré */
const CAPTIONS = [
  [1.44, ['Vous', 0], ['payez', .44], ['plus', .68], ['de', .8], ['*800', .9], ['*euros', 1.14]],
  [2.2, ['de', 1.34], ['*factures', 1.44], ['*gaz', 1.78], ['ou', 2.04]],
  [3.54, ['*électricité', 2.2], ['par', 2.66], ['*mois ?', 2.84]],
  [4.82, ['Chez', 3.54], ['*Energy', 3.84], ['*Market,', 4.1]],
  [5.78, ['on', 4.82], ['accompagne', 4.9], ['chaque', 5.34], ['jour', 5.54]],
  [6.98, ['*TPE', 5.78], ['ou', 6.28], ['*PME', 6.5]],
  [8.72, ['à', 6.98], ['réduire', 7.3], ['leurs', 7.7], ['*charges.', 7.82]],
  [10.48, ['On', 8.72], ['analyse', 8.86], ['*gratuitement', 9.24], ['vos', 9.84], ['factures', 10.0]],
  [12.06, ['et', 10.48], ['on', 10.78], ['vous', 10.86], ['donne', 10.98], ['les', 11.16], ['*bons', 11.32], ['*conseils', 11.52]],
  [13.9, ['pour', 12.06], ['éviter', 12.3], ['les', 12.6], ['prochaines', 12.74], ['*hausses.', 13.12]],
  [15.18, ['*Pas', 13.9], ['de', 14.04], ['changement', 14.14], ['de', 14.4], ['compteur,', 14.5]],
  [16.64, ['*pas', 15.18], ["d'achat", 15.28], ['de', 15.56], ['nouveaux', 15.64], ['services,', 15.78]],
  [17.66, ['*pas', 16.64], ["*d'honoraires.", 16.74]],
  [19.46, ['Juste,', 17.66], ['vous', 18.36], ['*payez', 18.52], ['*moins.', 18.8]],
  [21.72, ['Envoyez-nous', 19.46], ['votre', 19.98], ['*dernière', 20.2], ['*facture.', 20.54]],
  [VIDEO_END - .1, ['*Diagnostic', 21.72], ['*gratuit', 22.24], ['en', 22.58], ['*24', 22.96], ['*heures.', 23.34]],
];

const ICON = {
  user: '<svg viewBox="0 0 46 46"><circle cx="23" cy="16" r="8" fill="none" stroke="#13204d" stroke-width="4"/><path d="M8 40 c1-10 7-13 15-13 s14 3 15 13" fill="none" stroke="#13204d" stroke-width="4" stroke-linecap="round"/><path d="M34 6 v10 M29 11 h10" stroke="#13204d" stroke-width="4" stroke-linecap="round"/></svg>',
  shop: '<svg viewBox="0 0 46 46"><path d="M6 16 L10 6 H36 L40 16 Z" fill="#13204d"/><rect x="9" y="20" width="28" height="20" rx="2" fill="none" stroke="#13204d" stroke-width="4"/><rect x="19" y="27" width="8" height="13" fill="#13204d"/></svg>',
  phone: '<svg viewBox="0 0 46 46"><path d="M14 5 l6 9 -4 4 c2 5 6 9 11 11 l4 -4 9 6 -3 7 c-14 1 -30 -15 -29 -29 z" fill="#13204d"/></svg>',
  free: '<svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="#13204d" stroke-width="4"/><path d="M15 24 l6 6 11 -13" stroke="#13204d" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  euro: '<svg viewBox="0 0 46 46"><rect x="3" y="10" width="40" height="26" rx="5" fill="none" stroke="#13204d" stroke-width="4"/><text x="23" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#13204d" font-family="Plus Jakarta Sans">€</text></svg>',
  web: '<svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="#13204d" stroke-width="4"/><ellipse cx="23" cy="23" rx="8" ry="18" fill="none" stroke="#13204d" stroke-width="3"/><path d="M5 23 h36" stroke="#13204d" stroke-width="3"/></svg>',
  q: '<span>?</span>',
  bolt: '<svg viewBox="0 0 46 46"><path d="M26 3 L9 26 h12 l-3 17 L37 19 H24 z" fill="#13204d"/></svg>',
  search: '<svg viewBox="0 0 46 46"><circle cx="19" cy="19" r="12" fill="none" stroke="#13204d" stroke-width="5"/><path d="M28 28 l11 11" stroke="#13204d" stroke-width="6" stroke-linecap="round"/></svg>',
  doc: '<svg viewBox="0 0 46 46"><path d="M11 4 h16 l9 9 v29 h-25 z" fill="none" stroke="#13204d" stroke-width="4" stroke-linejoin="round"/><path d="M16 22 h14 M16 29 h14 M16 36 h9" stroke="#13204d" stroke-width="3.5" stroke-linecap="round"/></svg>',
  clock: '<svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="#13204d" stroke-width="4"/><path d="M23 12 v12 l8 5" stroke="#13204d" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>',
  ok: '<svg viewBox="0 0 46 46"><path d="M10 24 l9 9 17 -20" stroke="#13204d" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

/* Sous-titres */
const caps = CAPTIONS.map(([end, ...ws], gi) => {
  const d = document.createElement('div'); d.className = 'cap';
  const words = ws.map(([w, at]) => {
    const sp = document.createElement('span'); sp.className = 'cw' + (w[0] === '*' ? ' key' : '');
    sp.textContent = w.replace('*', ''); d.appendChild(sp); d.appendChild(document.createTextNode(' '));
    return { el: sp, at };
  });
  $('caps').appendChild(d);
  return { el: d, a: ws[0][1] - .08, b: Math.min(end, CAPTIONS[gi + 1] ? CAPTIONS[gi + 1][1][1] - .08 : end), words };  // jamais deux groupes à l'écran
});

/* Étiquettes d'étape */
const tags = PHASES.map(([a, b, n, txt]) => {
  const d = document.createElement('div'); d.className = 'tag';
  d.innerHTML = `<div class="n">${ICON[n] || n}</div><span>${txt}</span>`;
  $('tagwrap').appendChild(d);
  return { el: d, a, b };
});

/* Pastille dorée : une entrée par texte différent */
const pills = [];
PHASES.forEach(([a, b, , , ic, txt]) => {
  const last = pills[pills.length - 1];
  if (last && last.txt === txt) { last.b = b; return; }
  const d = document.createElement('div'); d.className = 'pt';
  d.innerHTML = ICON[ic] + `<span>${txt}</span>`;
  $('pill').appendChild(d);
  pills.push({ el: d, a, b, txt });
});
pills[pills.length - 1].b = 999;
document.fonts.ready.then(() => pills.forEach(({ el }) => {
  const sp = el.querySelector('span'); let fs = 32;
  while (sp.offsetWidth > 440 - 42 - 14 - 30 && fs > 20) sp.style.fontSize = (--fs) + 'px';
}));

/* Pièces qui jaillissent de la pastille sur « commission » */
const coins = [...Array(12)].map((_, i) => {
  const c = document.createElement('div'); c.className = 'coin'; c.textContent = '€'; $('coins').appendChild(c);
  const ang = -Math.PI / 2 + (i / 11 - .5) * 2.0;
  return { el: c, vx: Math.cos(ang) * (300 + (i * 61) % 180), vy: Math.sin(ang) * (900 + (i * 83) % 300), spin: (i % 2 ? 1 : -1) * (240 + i * 25) };
});

function render(t) {
  /* Mise en place */
  const k0 = ease.outQuint(prog(t, 0, .5));
  $('head').style.transform = `translateY(${lerp(-40, 0, k0)}px)`;
  $('head').style.opacity = k0;
  $('rule').style.transform = `scaleX(${ease.out(prog(t, .15, .8))})`;
  const kb = ease.back(prog(t, .2, .7));
  $('bar').style.transform = `translateY(${lerp(180, 0, kb)}px)`;

  /* Étiquettes */
  for (const g of tags) {
    const kin = ease.back(prog(t, g.a, g.a + .45)), kout = ease.in(prog(t, g.b - .25, g.b));
    g.el.style.opacity = Math.min(clamp(prog(t, g.a, g.a + .2)), 1 - kout);
    g.el.style.transform = `translate(-50%, ${lerp(-30, 0, kin) - kout * 20}px) scale(${lerp(.6, 1, kin) * (1 - kout * .1)})`;
  }

  /* Sous-titres */
  for (const c of caps) {
    const on = t >= c.a && t < c.b;
    c.el.style.opacity = on ? 1 : 0;
    if (!on) continue;
    const k = ease.back(prog(t, c.a, c.a + .22));
    c.el.style.transform = `translateX(-50%) scale(${lerp(.82, 1, k)})`;
    for (const w of c.words) {
      const cur = t >= w.at && !c.words.some(o => o.at > w.at && t >= o.at);
      w.el.classList.toggle('cur', cur);
      w.el.style.transform = `scale(${cur ? 1 + .06 * Math.sin(Math.PI * prog(t, w.at, w.at + .2)) : 1})`;
    }
  }

  /* Pastille */
  for (const p of pills) {
    const kin = ease.outQuint(prog(t, p.a, p.a + .4)), kout = ease.in(prog(t, p.b - .05, p.b + .25));
    p.el.style.opacity = Math.min(kin, 1 - kout);
    p.el.style.transform = `translateY(${lerp(60, 0, kin) - kout * 60}px)`;
  }
  const sh = (t % 3.2) / 3.2 * 160;
  $('shine').style.background = `linear-gradient(105deg, transparent ${sh - 30}%, rgba(255,255,255,.45) ${sh - 20}%, transparent ${sh - 10}%)`;
  const bump = Math.sin(Math.PI * prog(t, COMMISSION_AT - .05, COMMISSION_AT + .4)) * .08;
  $('pill').style.transform = `scale(${1 + bump})`;

  /* Pièces */
  coins.forEach((c, i) => {
    const tt = t - COMMISSION_AT - i * .03;
    if (tt < 0 || tt > 1.5) { c.el.style.opacity = 0; return; }
    const x = 800 + c.vx * tt, y = 1800 + c.vy * tt + 1300 * tt * tt;
    c.el.style.opacity = 1 - prog(tt, 1.0, 1.5);
    c.el.style.transform = `translate(${x}px, ${y}px) rotate(${c.spin * tt}deg) scaleX(${Math.cos(tt * 9 + i) * .35 + .75})`;
  });

  /* Écran de fin : balayage doré puis carton crème */
  const kw = ease.inOut(prog(t, VIDEO_END - .45, VIDEO_END + .25));
  $('wipe').style.transform = `translateY(${lerp(2000, -2600, kw)}px) skewY(-8deg)`;
  const ke = ease.outQuint(prog(t, VIDEO_END - .15, VIDEO_END + .35));
  $('end').style.transform = `translateY(${lerp(2000, 0, ke)}px)`;
  const e0 = VIDEO_END + .2;
  [['e1', 0, .5], ['e2', .25, .8], ['e3', .4, .8], ['e4', .6, .8], ['e5', .9, .6], ['e6', 1.1, .8]].forEach(([id, d, sc]) => {
    const k = (id === 'e5' || id === 'e1' ? ease.back : ease.outQuint)(prog(t, e0 + d, e0 + d + .5));
    $(id).style.opacity = clamp(prog(t, e0 + d, e0 + d + .25));
    $(id).style.transform = `translateY(${lerp(50, 0, k)}px) scale(${lerp(sc, 1, k)})`;
  });
  if (t > e0 + 1.5) $('e5').style.transform = `scale(${1 + Math.sin((t - e0 - 1.5) * 5) * .03})`;
}

window.DURATION = DURATION;
window.render = render;
const params = new URLSearchParams(location.search);
if (params.has('preview')) document.body.classList.add('preview');
if (params.has('t')) render(parseFloat(params.get('t')));
else if (!params.has('capture')) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
