<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Energy Market — Apporteurs d'affaires 9:16</title>
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('../assets/PlusJakartaSans.woff2') format('woff2');
    font-weight: 200 800;
  }
  :root {
    --cream: #f7f2e9;
    --cream-2: #efe6d6;
    --navy: #1b2c66;
    --navy-deep: #13204d;
    --gold: #c9a24f;
    --gold-2: #e3c67f;
    --gold-light: #f4e7c4;
    --ink: #142152;
    --green: #2f9e5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
  body { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(90% 60% at 50% 18%, #fffdf8 0%, var(--cream) 55%, var(--cream-2) 100%); }
  .anim { will-change: transform, opacity; }

  /* ---------- En-tête (logo) ---------- */
  #head { position: absolute; left: 0; top: 46px; width: 1080px; text-align: center; }
  #logo { width: 500px; display: block; margin: 0 auto; }
  #tagline { margin-top: 6px; font-size: 34px; font-weight: 600; letter-spacing: .32em; color: var(--navy); padding-left: .32em; }
  #rule { width: 600px; height: 3px; margin: 26px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); transform-origin: center; }

  /* ---------- Cadre « photo » ---------- */
  #frame { position: absolute; left: 14px; top: 430px; width: 1052px; height: 1060px; border-radius: 26px;
    background: var(--navy); padding: 16px; box-shadow: 0 30px 70px rgba(20,33,82,.28); }
  #frame::after { content: ''; position: absolute; inset: 9px; border: 3px solid var(--gold); border-radius: 20px; pointer-events: none; }
  .corner { position: absolute; width: 70px; height: 70px; border: 7px solid var(--gold-2); z-index: 3; }
  .corner.tl { left: 2px; top: 2px; border-right: 0; border-bottom: 0; border-top-left-radius: 24px; }
  .corner.tr { right: 2px; top: 2px; border-left: 0; border-bottom: 0; border-top-right-radius: 24px; }
  .corner.bl { left: 2px; bottom: 2px; border-right: 0; border-top: 0; border-bottom-left-radius: 24px; }
  .corner.br { right: 2px; bottom: 2px; border-left: 0; border-top: 0; border-bottom-right-radius: 24px; }
  #scene-wrap { position: relative; width: 1020px; height: 1028px; overflow: hidden; border-radius: 14px; background: #e6d9c4; }
  #scene { position: absolute; left: 0; top: 0; width: 1020px; height: 1028px; transform-origin: 50% 40%; }

  /* Pastilles et cartes incrustées dans la scène */
  .ov { position: absolute; opacity: 0; }
  .tag { display: inline-flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 999px;
    background: var(--navy); color: #fff; font-size: 34px; font-weight: 800; letter-spacing: .04em;
    border: 3px solid var(--gold); box-shadow: 0 16px 40px rgba(20,33,82,.35); white-space: nowrap; }
  .chip { display: flex; align-items: center; gap: 18px; width: 340px; padding: 16px 22px; border-radius: 24px;
    background: rgba(255,255,255,.96); box-shadow: 0 18px 40px rgba(20,33,82,.28); font-size: 34px; font-weight: 800; color: var(--navy); }
  .chip .ic { flex: 0 0 72px; height: 72px; border-radius: 50%; background: var(--navy); display: flex; align-items: center; justify-content: center; }
  .chip .ic svg { width: 42px; height: 42px; }
  .card { border-radius: 28px; background: rgba(255,255,255,.97); box-shadow: 0 22px 50px rgba(20,33,82,.3); color: var(--navy); }
  .bubble { position: relative; padding: 24px 30px; border-radius: 28px; background: #fff; box-shadow: 0 18px 44px rgba(20,33,82,.3);
    font-size: 36px; font-weight: 800; color: var(--navy); line-height: 1.2; }
  .bubble::after { content: ''; position: absolute; right: 60px; bottom: -22px; border: 14px solid transparent; border-top: 16px solid #fff; border-bottom: 0; transform: scaleX(1.4); }
  .stamp { padding: 14px 26px; border: 7px solid var(--green); border-radius: 18px; color: var(--green); font-size: 44px; font-weight: 800;
    letter-spacing: .04em; background: rgba(255,255,255,.88); white-space: nowrap; }

  /* ---------- Citation ---------- */
  #quote { position: absolute; left: 62px; top: 1338px; width: 956px; height: 360px; border-radius: 30px;
    background: #fffdf9; border: 3px solid var(--gold); box-shadow: 0 22px 60px rgba(20,33,82,.22); overflow: hidden; }
  #q-text { position: absolute; left: 66px; right: 56px; top: 0; bottom: 0; display: flex; align-items: center;
    font-size: 54px; font-weight: 600; line-height: 1.24; letter-spacing: -.012em; color: var(--ink); }
  #q-text p { width: 100%; text-indent: -26px; }
  #q-text .w { display: inline-block; white-space: pre; text-indent: 0; }
  #q-text .k { color: #a9822f; font-weight: 800; }
  #q-mark { position: absolute; left: 22px; top: -6px; font-size: 150px; font-weight: 800; color: var(--gold); opacity: .28; line-height: 1; }
  #q-bar { position: absolute; left: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, var(--gold), var(--gold-2)); }

  /* ---------- Barre du bas ---------- */
  #bar { position: absolute; left: 62px; top: 1730px; width: 956px; height: 150px; border-radius: 30px; background: var(--navy);
    display: flex; align-items: center; padding: 0 14px 0 22px; gap: 18px; box-shadow: 0 20px 50px rgba(20,33,82,.3);
    border: 3px solid rgba(201,162,79,.55); }
  #avatar { flex: 0 0 88px; height: 88px; border-radius: 50%; border: 4px solid var(--gold); display: flex; align-items: center; justify-content: center; overflow: hidden; background: #24387a; }
  #who { color: #fff; font-size: 29px; font-weight: 700; line-height: 1.3; white-space: nowrap; }
  #who span { color: var(--gold-2); }
  #who small { display: block; font-size: 24px; font-weight: 600; color: rgba(255,255,255,.75); }
  #pill { margin-left: auto; flex: 0 0 430px; position: relative; height: 112px; width: 430px; border-radius: 24px; overflow: hidden;
    background: linear-gradient(135deg, #f1d58c 0%, #c9a24f 55%, #b48a39 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.5); }
  .pt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 0 18px;
    font-size: 33px; font-weight: 800; color: var(--navy-deep); white-space: nowrap; letter-spacing: -.01em; }
  .pt svg { flex: 0 0 auto; width: 46px; height: 46px; }
  .pt span { flex-shrink: 0; }
</style>
</head>

<script>
/* ---------- Outils ---------- */
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  outQuint: x => 1 - Math.pow(1 - x, 5),
  in: x => x * x * x,
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
// bruit doux déterministe (somme de sinus) pour les micro-mouvements
const wob = (t, s = 1) => Math.sin(t * 1.3 * s) * .5 + Math.sin(t * 2.7 * s + 1.7) * .3 + Math.sin(t * 4.1 * s + .4) * .2;

const TM = window.TIMING;
const DURATION = TM.duration;

const EV = TM.events;
const lineAt = t => { let cur = TM.lines[0]; for (const l of TM.lines) if (t >= l.start - .25) cur = l; return cur; };

/* Apparition / disparition standard d'un élément HTML. */
function pop(el, t, tin, tout, o = {}) {
  const dur = o.dur ?? .5, outDur = o.outDur ?? .3;
  const k = (o.easeIn ?? ease.back)(prog(t, tin, tin + dur));
  const q = ease.in(prog(t, tout - outDur, tout));
  const s = lerp(o.scale ?? .6, 1, k) * (1 - q * .15);
  const x = lerp(o.dx ?? 0, 0, k), y = lerp(o.dy ?? 30, 0, k) - q * 20;
  el.style.opacity = Math.min(clamp(prog(t, tin, tin + dur * .5)), 1 - q);
  el.style.transform = `translate(${x}px, ${y}px) scale(${s}) rotate(${o.rot ?? 0}deg)`;
}

/* ---------- Bouche ---------- */
function mouthAt(t) {
  const f = clamp(t * TM.fps, 0, TM.mouth.length - 1), i = Math.floor(f), r = f - i;
  const g = a => lerp(a[i], a[Math.min(i + 1, a.length - 1)], r);
  return { o: g(TM.mouth), rd: g(TM.round) };
}
function drawMouth(o, rd, smile) {
  const cx = 512, cy = 478;
  const w = 76 - 28 * rd * o + smile * 10, h = 40 * o;
  const lx = cx - w / 2, rx = cx + w / 2, cyc = cy - smile * 8;
  const top = cy + 3 - h * .28, bot = cy + 7 + h * .95;
  const d = `M${lx},${cyc} Q${cx},${top} ${rx},${cyc} Q${cx},${bot + 4} ${lx},${cyc} Z`;
  $('mInner').setAttribute('d', d);
  $('mInner').setAttribute('opacity', clamp(o * 8));
  $('mouthClipPath').setAttribute('d', d);
  const th = Math.min(10, h * .3);
  Object.entries({ x: cx - w * .34, y: top - 4, width: w * .68, height: th + 6, rx: 4 }).forEach(([k, v]) => $('mTeeth').setAttribute(k, v));
  Object.entries({ cx: cx, cy: bot + 4, rx: w * .3, ry: Math.max(2, h * .38) }).forEach(([k, v]) => $('mTongue').setAttribute(k, v));
  // contour : simple trait souriant quand la bouche est fermée
  $('mLips').setAttribute('d', o < .05 ? `M${lx},${cyc} Q${cx},${cy + 10} ${rx},${cyc}` : d);
  $('mLips').setAttribute('stroke-width', 4.5);
  $('mLower').setAttribute('d', `M${cx - w * .24},${bot + 13} Q${cx},${bot + 18} ${cx + w * .24},${bot + 13}`);
}

/* ---------- Bras droit : cinématique inverse à 2 segments ---------- */
const SH = [742, 690], L1 = 230, L2 = 220;
function drawArm(hx, hy, rot, pose, scale = 1) {
  let dx = hx - SH[0], dy = hy - SH[1], dist = Math.hypot(dx, dy);
  const dd = Math.min(dist, L1 + L2 - 1);
  const a = Math.atan2(dy, dx), cosA = (L1 * L1 + dd * dd - L2 * L2) / (2 * L1 * dd);
  const b = Math.acos(clamp(cosA, -1, 1));
  // coude toujours vers l'extérieur du corps (côté droit de l'écran)
  const ang = Math.cos(a - b) > Math.cos(a + b) ? a - b : a + b;
  const ex = SH[0] + Math.cos(ang) * L1, ey = SH[1] + Math.sin(ang) * L1;
  $('armUpper').setAttribute('d', `M${SH[0]},${SH[1]} L${ex},${ey}`);
  $('armFore').setAttribute('d', `M${ex},${ey} L${hx},${hy}`);
  for (const [k, g] of Object.entries(handParts)) g.style.display = k === pose ? '' : 'none';
  handG.setAttribute('transform', `translate(${hx} ${hy}) rotate(${rot}) scale(${scale})`);
}

/* Poses clés du bras : [t, x, y, rotation, main] — interpolées avec easing. */
const REST = [900, 1240, -10];
const KEYS = [];
function gesture(t0, t1, pos, pose, extra = {}) { KEYS.push({ t0, t1, pos, pose, ...extra }); }
gesture(L.intro.start - .45, L.intro.start + 1.55, [830, 500, 10], 'open', { wave: true });
gesture(L.pro.start + .1, L.pro.start + 1.3, [800, 600, 8], 'point', { count: true });
gesture(EV.contact - .55, L.contact.end + .25, [800, 760, 4], 'phone');
gesture(EV.sign - .1, L.pay.end + .35, [790, 700, 6], 'bills');
gesture(L.cta.start + .05, DURATION + 1, [790, 640, -4], 'thumb');

function armAt(t) {
  for (const g of KEYS) {
    if (t < g.t0 || t > g.t1 + .45) continue;
    const kin = ease.outQuint(prog(t, g.t0, g.t0 + .45)), kout = ease.inOut(prog(t, g.t1, g.t1 + .45));
    const k = kin * (1 - kout);
    let [x, y, r] = g.pos;
    if (g.wave) r += Math.sin((t - g.t0) * 13) * 16 * clamp(prog(t, g.t0 + .3, g.t0 + .5));
    if (g.count) { y += Math.sin((t - g.t0) * 3) * 10; r += Math.sin((t - g.t0) * 2.2) * 6; }
    else { y += wob(t, 1.4) * 6; r += wob(t + 3, 1.1) * 3; }
    return { x: lerp(REST[0], x, k), y: lerp(REST[1], y, k), r: lerp(REST[2], r, k), pose: g.pose };
  }
  return { x: REST[0], y: REST[1], r: REST[2], pose: 'open' };
}

/* ---------- Clignements, sourcils, hochements ---------- */
const BLINKS = [2.1, 5.3, 8.6, 11.2, 13.9, 17.1, 20.9, 23.9, 25.4];
const NODS = [L.hook.start + .1, EV.contact, L.nego.start + .1, EV.pay, EV.url];
const RAISE = [[L.intro.start - .1, L.intro.start + .7], [L.pro.start + .4, L.pro.start + 1.2], [L.pro.end - .8, L.pro.end],
  [EV.sign - .1, EV.pay + .9], [L.cta.start, L.cta.start + .8]];

function render(t) {
  /* --- Mise en place générale --- */
  const kin = ease.outQuint(prog(t, 0, .6));
  $('head').style.transform = `translateY(${lerp(-60, 0, kin)}px)`;
  $('head').style.opacity = kin;
  $('rule').style.transform = `scaleX(${ease.out(prog(t, .2, .9))})`;
  const kf = ease.outQuint(prog(t, .05, .7));
  $('frame').style.transform = `translateY(${lerp(80, 0, kf)}px) scale(${lerp(.94, 1, kf)})`;
  $('frame').style.opacity = clamp(prog(t, .05, .35));
  const kq = ease.back(prog(t, .3, .85));
  $('quote').style.transform = `translateY(${lerp(120, 0, kq)}px)`;
  $('quote').style.opacity = clamp(prog(t, .3, .5));
  const kb = ease.back(prog(t, .45, 1));
  $('bar').style.transform = `translateY(${lerp(140, 0, kb)}px)`;
  $('bar').style.opacity = clamp(prog(t, .45, .65));

  /* --- Caméra : léger push-in + coups de zoom sur les temps forts --- */
  let zoom = 1 + .05 * ease.inOut(prog(t, 0, DURATION));
  for (const e of [EV.contact, EV.pay]) zoom += .035 * Math.sin(Math.PI * prog(t, e - .2, e + .9));
  $('scene').style.transform = `scale(${zoom}) translate(${wob(t, .3) * 4}px, ${wob(t + 9, .25) * 3}px)`;
  $('curtain').setAttribute('transform', `translate(${Math.sin(t * .8) * 6} 0) skewX(${Math.sin(t * .6) * 1.2})`);

  /* --- Personnage --- */
  const { o, rd } = mouthAt(t);
  let nod = 0;
  for (const n of NODS) nod += Math.sin(Math.PI * prog(t, n - .05, n + .45)) * 5;
  const talk = o * 2.2;
  const tilt = wob(t, .7) * 2.4 + Math.sin(t * 9) * talk * .6;
  const hx = wob(t + 4, .5) * 5, hy = wob(t + 2, .6) * 3 + nod - talk;
  $('headG').setAttribute('transform', `translate(${hx} ${hy}) rotate(${tilt} 510 560)`);
  const breath = Math.sin(t * 2.1) * .006;
  $('body').setAttribute('transform', `translate(0 ${-breath * 600}) scale(1 ${1 + breath})`);
  $('body').style.transformOrigin = '510px 1028px';
  // regard : suit la main quand elle tient quelque chose, sinon caméra avec micro-saccades
  const arm = armAt(t);
  const lookHand = arm.pose === 'phone' || arm.pose === 'bills' ? clamp((960 - arm.y) / 260) * Math.sin(Math.PI * clamp((t * 1.3) % 2.4 / 1.2)) : 0;
  const gx = lookHand * 7 + Math.round(wob(t * .6, 1)) * 2, gy = lookHand * 2;
  document.querySelectorAll('.iris').forEach(el => el.setAttribute('transform', `translate(${gx} ${gy})`));
  let blink = 0;
  for (const b of BLINKS) blink = Math.max(blink, Math.sin(Math.PI * prog(t, b, b + .18)));
  let raise = 0;
  for (const [a, b] of RAISE) raise = Math.max(raise, Math.sin(Math.PI * prog(t, a, b)) ** .6);
  const lidH = blink * 34 + (1 - raise) * 2;
  document.querySelectorAll('.lid').forEach(el => el.setAttribute('height', lidH));
  document.querySelectorAll('.lash').forEach((el, i) => {
    const x = i ? 558 : 462, y = 384 - 20 + lidH * .9, c = lerp(y - 4, y + 8, blink);
    el.setAttribute('d', `M${x - 26},${Math.max(y, 380 - 6 + blink * 10)} Q${x},${c} ${x + 26},${Math.max(y, 380 - 6 + blink * 10)}`);
  });
  $('brows').setAttribute('transform', `translate(0 ${-raise * 12 - talk * 1.5})`);
  const speaking = TM.lines.some(l => t > l.start - .1 && t < l.end + .1);
  const smile = speaking ? .55 + raise * .3 : .9;
  drawMouth(o, rd, smile);
  const sc = arm.pose === 'phone' ? 1.02 : 1;
  drawArm(arm.x, arm.y, arm.r, arm.pose, sc);
  const call = Math.sin(Math.PI * clamp(prog(t, EV.call - .1, EV.call + .5))) * .15;
  document.querySelectorAll('.callbtn').forEach(el => el.setAttribute('transform', `translate(0 28) scale(${1 + call}) translate(0 -28)`));

  /* --- Incrustations --- */
  pop($('o-hook'), t, L.hook.start + .05, L.pro.start - .1, { dy: -40 });
  [['o-pro1', 'commerçant'], ['o-pro2', 'restaurateur'], ['o-pro3', 'artisan']].forEach(([id, w]) => {
    const at = L.pro.spoken.find(s => s[0].toLowerCase() === w)[1];
    pop($(id), t, at - .08, L.contact.start - .15, { dx: -120, dy: 0, scale: .8 });
  });
  pop($('o-call'), t, EV.call - .25, L.nego.start - .1, { scale: .4, dy: 40 });
  pop($('o-nego'), t, L.nego.start + .1, L.pay.start - .1, { dx: 120, dy: 0, scale: .85 });
  const kn = ease.inOut(prog(t, L.nego.start + .5, L.nego.start + 1.6));
  $('o-nego-arrow').setAttribute('stroke-dashoffset', 300 * (1 - kn));
  const freeAt = L.nego.spoken.find(s => s[0].startsWith('gratuit'))[1];
  const kfree = ease.back(prog(t, freeAt - .1, freeAt + .35));
  $('o-nego-free').style.transform = `scale(${lerp(.4, 1, kfree)})`;
  $('o-nego-free').style.opacity = clamp(prog(t, freeAt - .1, freeAt + .1));
  pop($('o-sign'), t, EV.sign - .05, L.cta.start - .1, { scale: 2.2, dy: 0, rot: -8, dur: .35, easeIn: ease.outQuint });
  pop($('o-pay'), t, EV.pay - .05, L.cta.start - .1, { dx: -100, dy: 0, scale: .8 });
  pop($('o-url'), t, EV.url - .15, 999, { dy: -50, scale: .5 });

  /* --- Pluie de pièces sur « rémunère » --- */
  const ct = t - EV.pay;
  coinEls.forEach((c, i) => {
    const tt = ct - i * .025;
    if (tt < 0 || tt > 1.6) { c.g.setAttribute('opacity', 0); return; }
    const x = 770 + c.vx * tt, y = 460 + c.vy * tt + 900 * tt * tt;
    c.g.setAttribute('opacity', 1 - prog(tt, 1.1, 1.6));
    c.g.setAttribute('transform', `translate(${x} ${y}) rotate(${c.spin * tt}) scale(${Math.cos(tt * 9 + i) * .35 + .75} 1)`);
  });

  /* --- Citation --- */
  const line = lineAt(t);
  if (qShown !== line.id) buildQuote(line);
  const tIn = line.start - .25;
  const kl = ease.outQuint(prog(t, tIn, tIn + .35));
  const next = TM.lines[TM.lines.indexOf(line) + 1];
  const kout = next ? ease.in(prog(t, next.start - .45, next.start - .25)) : 0;
  qp.style.transform = `translateY(${lerp(40, 0, kl) - kout * 30}px)`;
  qp.style.opacity = Math.min(kl, 1 - kout);
  for (const w of qWords[line.id]) {
    const k = ease.out(prog(t, w.at - .06, w.at + .14));
    w.el.style.opacity = lerp(.22, 1, k);
    w.el.style.transform = `translateY(${lerp(10, 0, k)}px)`;
  }
  $('q-bar').style.width = (prog(t, line.start, line.end) * 100) + '%';

  /* --- Pastille dorée --- */
  let cur = 0;
  pillEls.forEach((p, i) => { if (t >= p.at) cur = i; });
  pillEls.forEach((p, i) => {
    const kIn = i === 0 ? ease.back(prog(t, .7, 1.1)) : ease.outQuint(prog(t, p.at, p.at + .4));
    const nx = pillEls[i + 1], kOut = nx ? ease.in(prog(t, nx.at - .05, nx.at + .25)) : 0;
    p.el.style.opacity = i > cur + 1 ? 0 : Math.min(kIn, 1 - kOut);
    p.el.style.transform = `translateY(${lerp(60, 0, kIn) - kOut * 60}px)`;
  });
  const shine = (t % 3.2) / 3.2;
  $('pill').style.backgroundImage = `linear-gradient(105deg, transparent ${shine * 160 - 30}%, rgba(255,255,255,.45) ${shine * 160 - 20}%, transparent ${shine * 160 - 10}%), linear-gradient(135deg, #f1d58c 0%, #c9a24f 55%, #b48a39 100%)`;
}

window.DURATION = DURATION;
window.render = render;
const params = new URLSearchParams(location.search);
if (params.has('t')) render(parseFloat(params.get('t')));
else if (!params.has('capture')) { // aperçu en boucle dans le navigateur
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
